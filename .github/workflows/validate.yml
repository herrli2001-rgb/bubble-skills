name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg for Linux smoke check
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tools/validate_publication.py
      - run: python -m unittest discover -s tests -v
  pixel-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python skills/bubble-pixel-video/scripts/bootstrap.py /tmp/bubble-pixel-check --theme 'CI example'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: /tmp/bubble-pixel-check
      - run: npm run lint
        working-directory: /tmp/bubble-pixel-check
